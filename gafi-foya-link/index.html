<script type="application/json" id="cs-web-src">{"modules":{"/src/main.tsx":"import React from 'react'\nimport ReactDOM from 'react-dom/client'\nimport App from './App.tsx'\nimport ErrorBoundary from './components/ErrorBoundary.tsx'\nimport './index.css'\n\nReactDOM.createRoot(document.getElementById('root')!).render(\n  \u003cReact.StrictMode>\n    \u003cErrorBoundary>\n      \u003cApp />\n    \u003c/ErrorBoundary>\n  \u003c/React.StrictMode>,\n)\n","/src/App.tsx":"import React, { useState, useMemo } from 'react';\nimport {\n  LayoutDashboard,\n  Inbox,\n  Ticket,\n  Users,\n  Smartphone,\n  Bot,\n  BookOpen,\n  UserCog,\n  BarChart3,\n  History,\n  Settings,\n  ShieldCheck,\n  Search,\n  Bell,\n  Plus,\n  Send,\n  Paperclip,\n  Smile,\n  CheckCheck,\n  Check,\n  Clock,\n  AlertCircle,\n  RefreshCw,\n  WifiOff,\n  QrCode,\n  Edit3,\n  Trash2,\n  Sparkles,\n  UserCheck,\n  X,\n  CheckCircle2,\n  Lock,\n  MessageSquarePlus,\n  Tag,\n  Menu,\n} from 'lucide-react';\nimport {\n  RoleType,\n  ConnectionStatus,\n  HandlingMode,\n  TicketStatus,\n  TicketPriority,\n  WhatsAppAccount,\n  KnowledgeItem,\n  Message,\n  Conversation,\n  SupportTicket,\n  SystemUser,\n} from './types';\nimport {\n  INITIAL_ACCOUNTS,\n  INITIAL_KB,\n  INITIAL_CONVERSATIONS,\n  INITIAL_TICKETS,\n  INITIAL_USERS,\n  INITIAL_LOGS,\n} from './data/initialData';\nimport { generateIsolatedAIResponse } from './utils/aiEngine';\nimport OverviewView from './components/OverviewView';\n\nexport default function App() {\n  const [activeNav, setActiveNav] = useState\u003cstring>('overview');\n  const [currentRole, setCurrentRole] = useState\u003cRoleType>('ADMIN');\n  const [sidebarOpen, setSidebarOpen] = useState\u003cboolean>(true);\n  const [globalSearch, setGlobalSearch] = useState\u003cstring>('');\n  const [toast, setToast] = useState\u003c{ type: 'success' | 'error' | 'info'; message: string } | null>(null);\n\n  const [accounts, setAccounts] = useState\u003cWhatsAppAccount[]>(INITIAL_ACCOUNTS);\n  const [selectedAccountId, setSelectedAccountId] = useState\u003cstring>('wa1');\n  const [kbItems, setKbItems] = useState\u003cKnowledgeItem[]>(INITIAL_KB);\n  const [conversations, setConversations] = useState\u003cConversation[]>(INITIAL_CONVERSATIONS);\n  const [activeConvId, setActiveConvId] = useState\u003cstring>('conv-1');\n  const [tickets, setTickets] = useState\u003cSupportTicket[]>(INITIAL_TICKETS);\n  const [users, setUsers] = useState\u003cSystemUser[]>(INITIAL_USERS);\n  const [activityLogs, setActivityLogs] = useState(INITIAL_LOGS);\n\n  const [statsPeriod, setStatsPeriod] = useState\u003c'HARI' | 'MINGGU' | 'BULAN' | 'CUSTOM'>('HARI');\n  const [inboxAccountFilter, setInboxAccountFilter] = useState\u003cstring>('ALL');\n  const [inboxModeFilter, setInboxModeFilter] = useState\u003cstring>('ALL');\n  const [inboxSearch, setInboxSearch] = useState\u003cstring>('');\n  const [chatInput, setChatInput] = useState\u003cstring>('');\n  const [showQuickReplies, setShowQuickReplies] = useState\u003cboolean>(false);\n\n  const [ticketStatusFilter, setTicketStatusFilter] = useState\u003cstring>('ALL');\n  const [ticketAccountFilter, setTicketAccountFilter] = useState\u003cstring>('ALL');\n  const [ticketAgentFilter, setTicketAgentFilter] = useState\u003cstring>('ALL');\n  const [ticketSearch, setTicketSearch] = useState\u003cstring>('');\n  const [selectedTicketDrawer, setSelectedTicketDrawer] = useState\u003cSupportTicket | null>(null);\n  const [ticketInternalNoteInput, setTicketInternalNoteInput] = useState\u003cstring>('');\n\n  const [modalNewMessage, setModalNewMessage] = useState\u003cboolean>(false);\n  const [modalNewTicket, setModalNewTicket] = useState\u003cboolean>(false);\n  const [modalEditAccount, setModalEditAccount] = useState\u003cWhatsAppAccount | null>(null);\n  const [modalQrAccount, setModalQrAccount] = useState\u003cWhatsAppAccount | null>(null);\n  const [modalAddKb, setModalAddKb] = useState\u003cboolean>(false);\n  const [modalAddUser, setModalAddUser] = useState\u003cboolean>(false);\n\n  const [sandboxInput, setSandboxInput] = useState\u003cstring>('');\n  const [sandboxReply, setSandboxReply] = useState\u003cstring | null>(null);\n\n  const [newMsgForm, setNewMsgForm] = useState({ accountId: 'wa1', phone: '', name: '', message: '' });\n  const [newTicketForm, setNewTicketForm] = useState({\n    accountId: 'wa1',\n    customerName: '',\n    customerPhone: '',\n    title: '',\n    description: '',\n    category: 'Technical Support',\n    priority: 'MEDIUM' as TicketPriority,\n    assignedAgent: 'Rina Wijaya',\n  });\n  const [newKbForm, setNewKbForm] = useState({\n    title: '',\n    type: 'TEXT' as 'PDF' | 'DOCX' | 'TXT' | 'TEXT' | 'FAQ',\n    category: 'Umum',\n    content: '',\n  });\n  const [newUserForm, setNewUserForm] = useState({\n    name: '',\n    email: '',\n    role: 'AGENT' as RoleType,\n    team: 'Support & Retention',\n  });\n\n  const activeAgentLabel =\n    currentRole === 'ADMIN' ? 'Arief Rahman' : currentRole === 'TEAM_LEADER' ? 'Nadia Putri' : 'Rina Wijaya';\n\n  const notify = (message: string, type: 'success' | 'error' | 'info' = 'success') => {\n    setToast({ message, type });\n    setTimeout(() => setToast(null), 3500);\n  };\n\n  const addLog = (account: string, action: string) => {\n    const timeStr = new Date().toTimeString().slice(0, 8);\n    setActivityLogs((prev) => [\n      { id: `log-${Date.now()}`, time: timeStr, user: `${currentRole}`, account, action },\n      ...prev,\n    ]);\n  };\n\n  const can = (\n    permission: 'MANAGE_ACCOUNTS' | 'MANAGE_AI_KB' | 'MANAGE_USERS' | 'ASSIGN_TICKET' | 'TOGGLE_AI'\n  ) => {\n    if (currentRole === 'ADMIN') return true;\n    if (currentRole === 'TEAM_LEADER') {\n      return ['ASSIGN_TICKET', 'TOGGLE_AI'].includes(permission);\n    }\n    if (currentRole === 'AGENT') {\n      return ['TOGGLE_AI'].includes(permission);\n    }\n    return false;\n  };\n\n  const activeConv = useMemo(\n    () => conversations.find((c) => c.id dMessage = () => {\n    if (!chatInput.trim() || !activeConv) return;\n    const acc = accounts.find((a) => a.id === activeConv.accountId);\n    if (acc?.status === 'Disconnected') {\n      notify(`Gagal mengirim: ${acc.name} sedang Disconnected. Hubungkan akun terlebih dahulu.`, 'error');\n      return;\n    }\n\n    const nowTime = new Date().toTimeString().slice(0, 5);\n    const newMsg: Message = {\n      id: `msg-${Date.now()}`,\n      sender: 'AGENT',\n      senderName: `${activeAgentLabel} (${currentRole})`,\n      text: chatInput.trim(),\n      timestamp: nowTime,\n      status: 'sent',\n    };\n\n    setConversations((prev) =>\n      prev.map((c) =>\n        c.id === activeConv.id\n          ? {\n              ...c,\n              mode: 'MANUAL',\n              lastTime: nowTime,\n              messages: [...c.messages, newMsg],\n            }\n          : c\n      )\n    );\n    setAccounts((prev) =>\n      prev.map((a) => (a.id === activeConv.accountId ? { ...a, outgoingToday: a.outgoingToday + 1 } : a))\n    );\n    setChatInput('');\n    addLog(acc?.name || activeConv.accountId, `Agen membalas pesan ke ${activeConv.customerName}`);\n  };\n\n  const handleSimulateCustomerMessage = () => {\n    if (!activeConv) return;\n    const sampleQuestions: Record\u003cstring, string[]> = {\n      wa1: [\n        'Berapa harga Paket Starter Produk A?',\n        'Berapa lama proses migrasi database Produk A?',\n        'Apakah Produk A punya printer bluetooth 58mm?',\n      ],\n      wa2: [\n        'Berapa harga Paket Kasir Pro Produk B?',\n        'Apakah Produk B support QRIS dinamis?',\n      ],\n      wa3: [\n        'Berapa hari proses pengajuan refund?',\n        'Jam berapa operasional Customer Service?',\n      ],\n      wa4: ['Berapa persen komisi untuk partner reseller resmi?'],\n    };\n\n    const pool = sampleQuestions[activeConv.accountId] || ['Halo, saya butuh informasi layanan.'];\n    const randomQuestion = pool[Math.floor(Math.random() * pool.length)];\n    const nowTime = new Date().toTimeString().slice(0, 5);\n\n    const incomingMsg: Message = {\n      id: `cust-${Date.now()}`,\n      sender: 'CUSTOMER',\n      senderName: activeConv.customerName,\n      text: randomQuestion,\n      timestamp: nowTime,\n      status: 'read',\n    };\n\n    const autoMessages: Message[] = [incomingMsg];\n    let aiReplied = false;\n\n    if (activeConv.mode === 'AI') {\n      const aiText = generateIsolatedAIResponse(accounts, kbItems, activeConv.accountId, randomQuestion);\n      autoMessages.push({\n        id: `ai-${Date.now() + 1}`,\n        sender: 'AI',\n        senderName: `AI Assistant (${activeConv.accountId.toUpperCase()})`,\n        text: aiText,\n        timestamp: nowTime,\n        status: 'delivered',\n      });\n      aiReplied = true;\n    }\n\n    setConversations((prev) =>\n      prev.map((c) =>\n        c.id === activeConv.id\n          ? {\n              ...c,\n              unreadCount: c.mode === 'MANUAL' ? c.unreadCount + 1 : 0,\n              lastTime: nowTime,\n              messages: [...c.messages, ...autoMessages],\n            }\n          : c\n      )\n    );\n    setAccounts((prev) =>\n      prev.map((a) =>\n        a.id === activeConv.accountId\n          ? {\n              ...a,\n              incomingToday: a.incomingToday + 1,\n              outgoingToday: a.outgoingToday + (aiReplied ? 1 : 0),\n            }\n          : a\n      )\n    );\n\n    notify(\n      aiReplied\n        ? `Pesan masuk & otomatis dibalas AI (${activeConv.accountId.toUpperCase()})`\n        : `Pesan pelanggan masuk (Mode Manual — menunggu balasan agen)`,\n      'info'\n    );\n  };\n\n  const toggleConversationMode = (convId: string) => {\n    if (!can('TOGGLE_AI')) {\n      notify('Role Anda tidak memiliki izin mengubah mode AI/Manual.', 'error');\n      return;\n    }\n    setConversations((prev) =>\n      prev.map((c) => {\n        if (c.id !== convId) return c;\n        const nextMode: HandlingMode = c.mode == \n      assignedAgent: 'Rina Wijaya',\n    });\n    addLog(created.accountId.toUpperCase(), `Membuat tiket ${newId}: ${created.title}`);\n    notify(`Tiket ${newId} berhasil dibuat!`);\n  };\n\n  const handleStartNewMessage = (e: React.FormEvent) => {\n    e.preventDefault();\n    const acc = accounts.find((a) => a.id === newMsgForm.accountId);\n    if (acc?.status === 'Disconnected') {\n      notify(`Tidak dapat mengirim pesan: ${acc.name} berstatus Disconnected.`, 'error');\n      return;\n    }\n\n    const newConv: Conversation = {\n      id: `conv-${Date.now()}`,\n      accountId: newMsgForm.accountId,\n      customerName: newMsgForm.name.trim() || newMsgForm.phone.trim(),\n      customerPhone: newMsgForm.phone.trim(),\n      customerAvatar: (newMsgForm.name.trim() || 'WA').slice(0, 2).toUpperCase(),\n      mode: 'MANUAL',\n      assignedAgent: activeAgentLabel,\n      unreadCount: 0,\n      lastTime: 'Baru saja',\n      tags: ['Outbound'],\n      internalNotes: 'Percakapan dimulai dari Quick Shortcut Buat Pesan.',\n      messages: [\n        {\n          id: `m-${Date.now()}`,\n          sender: 'AGENT',\n          senderName: `${activeAgentLabel} (${currentRole})`,\n          text: newMsgForm.message.trim(),\n          timestamp: new Date().toTimeString().slice(0, 5),\n          status: 'sent',\n        },\n      ],\n    };\n\n    setConversations((prev) => [newConv, ...prev]);\n    setActiveConvId(newConv.id);\n    setActiveNav('inbox');\n    setModalNewMessage(false);\n    setNewMsgForm({ accountId: 'wa1', phone: '', name: '', message: '' });\n    addLog(acc?.name || newMsgForm.accountId, `Memulai pesan keluar ke ${newConv.customerPhone}`);\n    notify('Pesan berhasil dikirim & dibuka di Inbox.');\n  };\n\n  const updateTicketStatus = (ticketId: string, status: TicketStatus) => {\n    setTickets((prev) =>\n      prev.map((t) => {\n        if (t.id !== ticketId) return t;\n        const updated = {\n          ...t,\n          status,\n          logs: [\n                  \u003cth className=\"py-3 px-4\">Tipe\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Kategori\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Status Indexing\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Pembaruan\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Digunakan AI\u003c/th>\n                      \u003cth className=\"py-3 px-4 text-right\">Aksi\u003c/th>\n                    \u003c/tr>\n                  \u003c/thead>\n                  \u003ctbody className=\"divide-y divide-slate-100 text-xs\">\n                    {kbItems\n                      .filter((k) => k.accountId === selectedAccountId)\n                      .filter((k) => {\n                        if (!q) return true;\n                        return (\n                          k.title.toLowerCase().includes(q) ||\n                          k.category.toLowerCase().includes(q) ||\n                          k.content.toLowerCase().includes(q)\n                        );\n                      })\n                      .map((item) => (\n                        \u003ctr key={item.id} className=\"hover:bg-slate-50\">\n                          \u003ctd className=\"py-3 px-4\">\n                            \u003cdiv className=\"font-bold text-slate-900\">{item.title}\u003c/div>\n                            \u003cdiv className=\"text-[11px] text-slate-500 line-clamp-1 max-w-md\">{item.content}\u003c/div>\n                          \u003c/td>\n                          \u003ctd className=\"py-3 px-4\">\n                            \u003cspan className=\"px-2 py-0.5 rounded bg-slate-100 font-bold text-[10px]\">{item.type}\u003c/span>\n                          \u003c/td>\n                          \u003ctd className=\"py-3 px-4 text-slate-600\">{item.category}\u003c/td>\n                          \u003ctd className=\"py-3 px-4\">\n                            \u003cspan className=\"px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[11px] font-semibold\">\n                              {item.status}\n                            \u003c/span>\n                          \u003c/td>\n                          \u003ctd className=\"py-3 px-4 text-[11px] text-slate-500\">{item.updatedAt}\u003c/td>\n                          \u003ctd className=\"py-3 px-4\">\n                            \u003cinput\n                              type=\"checkbox\"\n                              disabled={!can('MANAGE_AI_KB')}\n                              checked={item.activeForAI}\n                              onChange={() => {\n                                setKbItems((prev) =>\n                                  prev.map((k) => (k.id === item.id ? { ...k, activeForAI: !k.activeForAI } : k))\n                                );\n                              }}\n                              className=\"w-4 h-4 accent-emerald-600\"\n                            />\n                          \u003c/td>\n                          \u003ctd className=\"py-3 px-4 text-right\">\n                            \u003cbutton\n                              disabled={!can('MANAGE_AI_KB')}\n                              onClick={() => {\n                                setKbItems((prev) => prev.filter((k) => k.id !== item.id));\n                                notify('Konten Knowledge Base dihapus.');\n                              }}\n                              className=\"p-1.5 text-rose-600 hover:bg-rose-50 rounded disabled:opacity-40\"\n                            >\n                              \u003cTrash2 className=\"w-4 h-4\" />\n                            \u003c/button>\n                          \u003c/td>\n                        \u003c/tr>\n                      ))}\n                  \u003c/tbody>\n                \u003c/table>\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'customers' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">Direktori Pelanggan Multi-Account\u003c/h1>\n              \u003cdiv className=\"overflow-x-auto\">\n                \u003ctable className=\"w-full text-left border-collapse text-xs\">\n                  \u003cthead>\n                    \u003ctr className=\"border-b border-slate-200 bg-slate-50 text-[11px] font-bold text-slate-500 uppercase\">\n                      \u003cth className=\"py-3 px-4\">Nama Pelanggan\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Nomor WhatsApp\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Akun Terdaftar\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Tags\u003c/th>\n                      \u003cth className=\"py-3 px-4\">Agen\u003c/th>\n                    \u003c/tr>\n                  \u003c/thead>\n                  \u003ctbody className=\"divide-y divide-slate-100\">\n                    {conversations\n                      .filter(\n                        (c) =>\n                          !q ||\n                          c.customerName.toLowerCase().includes(q) ||\n                          c.customerPhone.toLowerCase().includes(q)\n                      )\n                      .map((c) => (\n                        \u003ctr key={c.id} className=\"hover:bg-slate-50\">\n                          \u003ctd className=\"py-3 px-4 font-bold text-slate-900\">{c.customerName}\u003c/td>\n                          \u003ctd className=\"py-3 px-4 text-slate-600\">{c.customerPhone}\u003c/td>\n                          \u003ctd className=\"py-3 px-4 font-semibold text-emerald-700\">{c.accountId.toUpperCase()}\u003c/td>\n                          \u003ctd className=\"py-3 px-4\">\n                            \u003cdiv className=\"flex gap-1\">\n                              {c.tags.map((t) => (\n                                \u003cspan key={t} className=\"px-2 py-0.5 rounded bg-slate-100 text-[10px]\">\n                                  {t}\n                                \u003c/span>\n                              ))}\n                            \u003c/div>\n                          \u003c/td>\n                          \u003ctd className=\"py-3 px-4\">{c.assignedAgent}\u003c/td>\n                        \u003c/tr>\n                      ))}\n                  \u003c/tbody>\n                \u003c/table>\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'team-agents' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">Performa Tim & Agen Customer Service\u003c/h1>\n              \u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n                {[\n                  { name: 'Rina Wijaya', team: 'Support & Retention', resolved: 48, avgTime: '1m 55d' },\n                  { name: 'Dimas Pratama', team: 'POS Technical', resolved: 39, avgTime: '2m 20d' },\n                  { name: 'Andi Saputra', team: 'B2B Sales', resolved: 27, avgTime: '3m 05d' },\n                ].map((ag) => (\n                  \u003cdiv key={ag.name} className=\"p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-2\">\n                    \u003cdiv className=\"font-bold text-sm text-slate-900\">{ag.name}\u003c/div>\n                    \u003cdiv className=\"text-xs text-slate-500\">Tim: {ag.team}\u003c/div>\n                    \u003cdiv className=\"pt-2 border-t border-slate-200 flex justify-between text-xs\">\n                      \u003cspan>\n                        Tiket Selesai: \u003cstrong>{ag.resolved}\u003c/strong>\n                      \u003c/span>\n                      \u003cspan>\n                        Avg Respon: \u003cstrong className=\"text-emerald-600\">{ag.avgTime}\u003c/strong>\n                      \u003c/span>\n                    \u003c/div>\n                  \u003c/div>\n                ))}\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'statistics' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">Laporan Statistik & Analitik Mendalam\u003c/h1>\n              \u003cp className=\"text-xs text-slate-500\">\n                Distribusi trafik pesan & penyelesaian tiket pada keempat akun WhatsApp.\n              \u003c/p>\n              \u003cdiv className=\"grid grid-cols-1 md:grid-cols-4 gap-4\">\n                {accounts.map((a) => (\n                  \u003cdiv key={a.id} className=\"p-4 rounded-xl border border-slate-200\">\n                    \u003cdiv className=\"text-xs font-bold text-slate-800\">{a.name}\u003c/div>\n                    \u003cdiv className=\"mt-2 text-2xl font-extrabold text-emerald-600\">\n                      {a.incomingToday + a.outgoingToday}\n                    \u003c/div>\n                    \u003cdiv className=\"text-[11px] text-slate-400\">Total pesan hari ini\u003c/div>\n                  \u003c/div>\n                ))}\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'activity-logs' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">Audit & Activity Logs\u003c/h1>\n              \u003cdiv className=\"divide-y divide-slate-100 text-xs\">\n                {activityLogs.map((log) => (\n                  \u003cdiv key={log.id} className=\"py-2.5 flex items-center justify-between gap-4\">\n                    \u003cdiv className=\"flex items-center gap-3\">\n                      \u003cspan className=\"font-mono text-[11px] text-slate-400\">{log.time}\u003c/span>\n                      \u003cspan className=\"px-2 py-0.5 rounded bg-slate-100 font-bold text-[10px]\">{log.user}\u003c/span>\n                      \u003cspan className=\"font-semibold text-emerald-700\">{log.account}\u003c/span>\n                      \u003cspan className=\"text-slate-700\">{log.action}\u003c/span>\n                    \u003c/div>\n                  \u003c/div>\n                ))}\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'user-management' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003cdiv className=\"flex items-center justify-between\">\n                \u003cdiv>\n                  \u003ch1 className=\"text-lg font-bold text-slate-900\">User Management\u003c/h1>\n                  \u003cp className=\"text-xs text-slate-500\">Kelola pengguna, role (ADMIN, TEAM LEADER, AGENT), dan status aktif.\u003c/p>\n                \u003c/div>\n                \u003cbutton\n                  disabled={!can('MANAGE_USERS')}\n                  onClick={() => setModalAddUser(true)}\n                  className=\"inline-flex items-center gap-1.5 px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold disabled:opacity-50\"\n                >\n                  \u003cPlus className=\"w-4 h-4\" /> Tambah User\n                \u003c/button>\n              \u003c/div>\n              \u003ctable className=\"w-full text-left border-collapse text-xs\">\n                \u003cthead>\n                  \u003ctr className=\"border-b border-slate-200 bg-slate-50 text-[11px] font-bold text-slate-500 uppercase\">\n                    \u003cth className=\"py-3 px-4\">Nama\u003c/th>\n                    \u003cth className=\"py-3 px-4\">Email\u003c/th>\n                    \u003cth className=\"py-3 px-4\">Role\u003c/th>\n                    \u003cth className=\"py-3 px-4\">Tim\u003c/th>\n                    \u003cth className=\"py-3 px-4\">Status\u003c/th>\n                  \u003c/tr>\n                \u003c/thead>\n                \u003ctbody className=\"divide-y divide-slate-100\">\n                  {users.map((u) => (\n                    \u003ctr key={u.id}>\n                      \u003ctd className=\"py-3 px-4 font-bold\">{u.name}\u003c/td>\n                      \u003ctd className=\"py-3 px-4 text-slate-500\">{u.email}\u003c/td>\n                      \u003ctd className=\"py-3 px-4\">\n                        \u003cspan className=\"px-2 py-0.5 rounded bg-slate-900 text-white text-[10px] font-bold\">{u.role}\u003c/span>\n                      \u003c/td>\n                      \u003ctd className=\"py-3 px-4\">{u.team}\u003c/td>\n                      \u003ctd className=\"py-3 px-4\">\n                        \u003cspan\n                          className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${\n                            u.active ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'\n                          }`}\n                        >\n                          {u.active ? 'Aktif' : 'Nonaktif'}\n                        \u003c/span>\n                      \u003c/td>\n                    \u003c/tr>\n                  ))}\n                \u003c/tbody>\n              \u003c/table>\n            \u003c/div>\n          )}\n\n          {activeNav === 'role-permissions' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">Matriks Role-Based Access Control (RBAC)\u003c/h1>\n              \u003cdiv className=\"grid grid-cols-1 md:grid-cols-3 gap-4 text-xs\">\n                \u003cdiv className=\"p-4 rounded-xl border border-slate-200 space-y-2\">\n                  \u003cdiv className=\"font-bold text-sm text-slate-900\">ADMIN\u003c/div>\n                  \u003cul className=\"list-disc pl-4 space-y-1 text-slate-600\">\n                    \u003cli>Akses penuh seluruh dashboard & 4 akun WhatsApp\u003c/li>\n                    \u003cli>Mengelola AI Assistant & Knowledge Base\u003c/li>\n                    \u003cli>Membuat, mengedit, dan menghapus user\u003c/li>\n                    \u003cli>Mengatur konfigurasi sistem & API\u003c/li>\n                  \u003c/ul>\n                \u003c/div>\n                \u003cdiv className=\"p-4 rounded-xl border border-slate-200 space-y-2\">\n                  \u003cdiv className=\"font-bold text-sm text-slate-900\">TEAM LEADER\u003c/div>\n                  \u003cul className=\"list-disc pl-4 space-y-1 text-slate-600\">\n                    \u003cli>Melihat percakapan & seluruh tiket dalam tim\u003c/li>\n                    \u003cli>Assign tiket ke agen\u003c/li>\n                    \u003cli>Memantau performa & statistik tim\u003c/li>\n                    \u003cli>Tidak dapat mengubah konfigurasi utama sistem\u003c/li>\n                  \u003c/ul>\n                \u003c/div>\n                \u003cdiv className=\"p-4 rounded-xl border border-slate-200 space-y-2\">\n                  \u003cdiv className=\"font-bold text-sm text-slate-900\">AGENT\u003c/div>\n                  \u003cul className=\"list-disc pl-4 space-y-1 text-slate-600\">\n                    \u003cli>Melihat percakapan yang ditugaskan\u003c/li>\n                    \u003cli>Membalas pesan & mengubah mode AI/Manual\u003c/li>\n                    \u003cli>Membuat & memperbarui tiket sesuai hak akses\u003c/li>\n                    \u003cli>Menambahkan catatan internal pelanggan\u003c/li>\n                  \u003c/ul>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          )}\n\n          {activeNav === 'general-settings' && (\n            \u003cdiv className=\"bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-4 max-w-2xl\">\n              \u003ch1 className=\"text-lg font-bold text-slate-900\">General & Integration Settings\u003c/h1>\n              \u003cp className=\"text-xs text-slate-500\">\n                Konfigurasi koneksi WhatsApp Business Cloud API & AI Provider Adapter.\n              \u003c/p>\n              \u003cdiv className=\"space-y-3 text-xs\">\n                \u003cdiv>\n                  \u003clabel className=\"block font-semibold mb-1\">WhatsApp Cloud API Webhook Endpoint\u003c/label>\n                  \u003cinput\n                    type=\"text\"\n                    readOnly\n                    value=\"https://api.wanexus.id/v1/webhooks/whatsapp\"\n                    className=\"w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg font-mono\"\n                  />\n                \u003c/div>\n                \u003cdiv>\n                  \u003clabel className=\"block font-semibold mb-1\">Status Kredensial API Produksi\u003c/label>\n                  \u003cdiv className=\"p-3 rounded-lg bg-amber-50 border border-amber-200 text-amber-800\">\n                    Adapter siap digunakan. Tambahkan environment variable \u003ccode>WHATSAPP_CLOUD_TOKEN\u003c/code> dan{' '}\n                    \u003ccode>GEMINI_API_KEY\u003c/code> pada backend untuk mengirim pesan WhatsApp live.\n                  \u003c/div>\n                \u003c/div>\n              \u003c/div>\n            \u003c/div>\n          )}\n        \u003c/main>\n      \u003c/div>\n\n      {/* MODALS & DRAWER */}\n      {modalNewMessage && (\n        \u003cdiv className=\"fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4\">\n          \u003cform\n            onSubmit={handleStartNewMessage}\n            className=\"bg-white rounded-2xl border border-slate-200 w-full max-w-md p-5 shadow-xl space-y-4\"\n          >\n            \u003cdiv className=\"flex items-center justify-between\">\n              \u003ch3 className=\"text-sm font-bold text-slate-900\">Buat Pesan WhatsApp Baru\u003c/h3>\n              \u003cbutton type=\"button\" onClick={() => setModalNewMessage(false)}>\n                \u003cX className=\"w-4 h-4 text-slate-400\" />\n              \u003c/button>\n            \u003c/div>\n            \u003cdiv className=\"space-y-3 text-xs\">\n              \u003cdiv>\n                \u003clabel className=\"block font-semibold mb-1\">Pilih Akun WhatsApp Pengirim\u003c/label>\n                \u003cselect\n                  value={newMsgForm.accountId}\n                  onChange={(e) => setNewMsgForm({ ...newMsgForm, accountId: e.target.value })}\n                  className=\"w-full px-3 py-2 border border-slate-200 rounded-lg\"\n                >\n                  {accounts.map((a) => (\n                    \u003coption key={a.id} value={a.id}>\n                      {a.name} ({a.status})\n                    \u003c/option>\n                  ))}\n                \u003c/select>\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel className=\"block font-semibold mb-1\">Nama Pelanggan (Opsional)\u003c/label>\n                \u003cinput\n                  type=\"text\"\n                  value={newMsgForm.name}\n                  onChange={(e) => setNewMsgForm({ ...newMsgForm, name: e.target.value })}\n                  placeholder=\"Contoh: Ibu Kartika\"\n                  className=\"w-full px-3 py-2 border border-slate-200 rounded-lg\"\n                />\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel className=\"block font-semibold mb-1\">Nomor Tujuan WhatsApp *\u003c/label>\n                \u003cinput\n                  required\n                  type=\"text\"\n                  value={newMsgForm.phone}\n                  onChange={(e) => setNewMsgForm({ ...newMsgForm, phone: e.target.value })}\n                  placeholder=\"+62 812-XXXX-XXXX\"\n                  className=\"w-full px-3 py-2 border border-slate-200 rounded-lg\"\n                />\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel className=\"block font-semibold mb-1\">Isi Pesan *\u003c/label>\n                \u003ctextarea\n                  required\n                  rows={3}\n                  value={newMsgForm.message}\n                  onChange={(e) => setNewMsgForm({ ...newMsgForm, message: e.target.value })}\n                  placeholder=\"Tulis pesan pembuka...\"\n                  className=\"w-full p-2.5 border border-slate-200 rounded-lg\"\n                />\n              \u003c/div>\n            \u003c/div>\n            \u003cdiv className=\"flex justify-end gap-2 pt-2\">\n              \u003cbutton\n                type=\"button\"\n                onClick={() => setModalNewMessage(false)}\n                className=\"px-3 py-2 rounded-lg border border-slate-200 text-xs font-semibold\"\n              >\n                Batal\n              \u003c/button>\n              \u003cbutton type=\"submit\" className=\"px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold\">\n                Kirim Pesan\n              \u003c/button>\n            \u003c/div>\n          \u003c/form>\n        \u003c/div>\n      )}\n\n      {modalNewTicket && (\n        \u003cdiv className=\"fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4\">\n          \u003cform\n            onSubmit={handleCreateTicket}\n            className=\"bg-white rounded-2xl border border-slate-200 w-full max-w-lg p-5 shadow-xl space-y-4\"\n          >\n            \u003cdiv className=\"flex items-center justify-between\">\n              \u003ch3 className=\"text-sm font-bold text-slate-900\">Buat Tiket Layanan Baru\u003c/h3>\n              \u003cbutton type=\"button\" onClick={() => setModalNewTicket(false)}>\n                \u003cX className=\"w-4 h-4 text-slate-400\" />\n              \u003c/button>\n            \u003c/div>\n            \u003cdiv className=\"grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs\">\n              \u003cdiv>\n                \u003clabel className=\"block font-semibold mb-1\">Akun WhatsApp\u003c/label>\n                \u003cselect\n  .toLowerCase()\n    .replace(/[^a-z0-9\\s]/g, ' ')\n    .split(/\\s+/)\n    .filter((w) => w.length >= 2);\n\n  const expanded = new Set\u003cstring>(rawTokens);\n  for (const token of rawTokens) {\n    if (SYNONYM_MAP[token]) {\n      SYNONYM_MAP[token].forEach((syn) => expanded.add(syn));\n    }\n    for (const [key, list] of Object.entries(SYNONYM_MAP)) {\n      if (list.includes(token)) {\n        expanded.add(key);\n        list.forEach((s) => expanded.add(s));\n      }\n    }\n  }\n  return Array.from(expanded);\n}\n\n/**\n * Menghasilkan jawaban AI hanya dari Knowledge Base milik `accountId` yang bersangkutan.\n * Menggabungkan potongan relevan jika ada lebih dari satu dokumen yang cocok.\n */\nexport function generateIsolatedAIResponse(\n  accounts: WhatsAppAccount[],\n  kbItems: KnowledgeItem[],\n  accountId: string,\n  customerQuestion: string\n): string {\n  const acc = accounts.find((a) => a.id === accountId);\n  if (!acc) return 'Akun tidak ditemukan.';\n  if (!acc.aiConfig.enabled) {\n    return '[AI Nonaktif pada akun ini — Menunggu balasan agen manual]';\n  }\n\n  const cleanQuestion = customerQuestion.trim();\n  if (!cleanQuestion) {\n    return acc.aiConfig.fallbackMessage;\n  }\n\n  // Strict account isolation filter\n  const accountKBs = kbItems.filter(\n    (k) => k.accountId === accountId && k.activeForAI && k.status === 'Indexed'\n  );\n\n  const terms = expandTerms(cleanQuestion);\n\n  const scored = accountKBs\n    .map((item) => {\n      const hay = `${item.title} ${item.category} ${item.content}`.toLowerCase();\n      let score = 0;\n      for (const term of terms) {\n        if (hay.includes(term)) {\n          score += item.title.toLowerCase().includes(term) ? 2 : 1;\n        }\n      }\n      return { item, score };\n    })\n    .filter((entry) => entry.score > 0)\n    .sort((a, b) => b.score - a.score);\n\n  if (scored.length === 0) {\n    return acc.aiConfig.fallbackMessage;\n  }\n\n  const topMatches = scored.slice(0, 2);\n  const summaryParts = topMatches.map(\n    ({ item }) => `[${item.title}] ${item.content}`\n  );\n\n  return `Berdasarkan ${acc.kbName}: ${summaryParts.join(' | ')}`;\n}\n","/src/components/OverviewView.tsx":"import React, { useMemo } from 'react';\nimport {\n  ChevronRight,\n  Ticket,\n  Clock,\n  CheckCircle2,\n  Search,\n} from 'lucide-react';\nimport {\n  WhatsAppAccount,\n  Conversation,\n  SupportTicket,\n  ConnectionStatus,\n} from '../types';\n\ninterface OverviewViewProps {\n  accounts: WhatsAppAccount[];\n  conversations: Conversation[];\n  tickets: SupportTicket[];\n  globalSearch: string;\n  statsPeriod: 'HARI' | 'MINGGU' | 'BULAN' | 'CUSTOM';\n  onChangePeriod: (p: 'HARI' | 'MINGGU' | 'BULAN' | 'CUSTOM') => void;\n  onNavigate: (nav: string) => void;\n  onSelectInboxAccount: (accountId: string) => void;\n  onSelectTicketStatus: (status: string) => void;\n}\n\nconst PERIOD_MULTIPLIER: Record\u003c'HARI' | 'MINGGU' | 'BULAN' | 'CUSTOM', { factor: number; label: string }> = {\n  HARI: { factor: 1, label: 'Hari Ini' },\n  MINGGU: { factor: 6.4, label: 'Minggu Ini (7 Hari)' },\n  BULAN: { factor: 26.8, label: 'Bulan Ini (30 Hari)' },\n  CUSTOM: { factor: 14.2, label: 'Rentang Kustom (14 Hari)' },\n};\n\nexport default function OverviewView({\n  accounts,\n  conversations,\n  tickets,\n  globalSearch,\n  statsPeriod,\n  onChangePeriod,\n  onNavigate,\n  onSelectInboxAccount,\n  onSelectTicketStatus,\n}: OverviewViewProps) {\n  const q = globalSearch.trim().toLowerCase();\n\n  const filteredAccounts = useMemo(() => {\n    if (!q) return accounts;\n    return accounts.filter(\n      (a) =>\n        a.name.toLowerCase().includes(q) ||\n        a.phone.toLowerCase().includes(q) ||\n        a.kbName.toLowerCase().includes(q)\n    );\n  }, [accounts, q]);\n\n  const filteredTicketsForSearch = useMemo(() => {\n    if (!q) return [];\n    return tickets.filter(\n      (t) =>\n        t.id.toLowerCase().includes(q) ||\n        t.title.toLowerCase().includes(q) ||\n        t.customerName.toLowerCase().includes(q)\n    );\n  }, [tickets, q]);\n\n  const filteredConvsForSearch = useMemo(() => {\n    if (!q) return [];\n    return conversations.filter(\n      (c) =>\n        c.customerName.toLowerCase().includes(q) ||\n        c.customerPhone.toLowerCase().includes(q) ||\n        c.messages.some((m) => m.text.toLowerCase().includes(q))\n    );\n  }, [conversations, q]);\n\n  // Dynamic statistics computed from live state + period factor\n  const dynamicStats = useMemo(() => {\n    const mult = PERIOD_MULTIPLIER[statsPeriod].factor;\n    const baseIncoming = accounts.reduce((sum, a) => sum + a.incomingToday, 0);\n    const baseOutgoing = accounts.reduce((sum, a) => sum + a.outgoingToday, 0);\n\n    let aiMessages = 0;\n    let manualMessages = 0;\n    conversations.forEach((conv) => {\n      conv.messages.forEach((m) => {\n        if (m.sender === 'AI') aiMessages++;\n        if (m.sender === 'AGENT') manualMessages++;\n      });\n    });\n\n    const totalAi = Math.round((aiMessages + 328) * mult);\n    const totalManual = Math.round((manualMessages + 153) * mult);\n    const totalHandled = Math.max(1, totalAi + totalManual);\n    const aiPct = Math.round((totalAi / totalHandled) * 100);\n    const manualPct = 100 - aiPct;\n\n    const baruCount = tickets.filter((t) => t.status === 'BARU').length;\n    const prosesCount = tickets.filter((t) => t.status === 'PROSES').length;\n    const selesaiCount = tickets.filter((t) => t.status === 'SELESAI').length;\n    const resolutionRate =\n      tickets.length > 0 ? ((selesaiCount / tickets.length) * 100).toFixed(1) : '0.0';\n\n    return {\n      totalIncoming: Math.round(baseIncoming * mult).toLocaleString('id-ID'),\n      totalOutgoing: Math.round(baseOutgoing * mult).toLocaleString('id-ID'),\n      activeConversations: conversations.length,\n      totalCustomers: Math.round((1244 + conversations.length) * (statsPeriod === 'HARI' ? 1 : 1 + (mult - 1) * 0.15)).toLocaleString('id-ID'),\n      totalTickets: tickets.length,\n      baruCount,\n      prosesCount,\n      selesaiCount,\n      totalAi,\n      totalManual,\n      aiPct,\n      manualPct,\n      resolutionRate,\n    };\n  }, [accounts, conversations, tickets, statsPeriod]);\n\n  const weeklyChartData = useMemo(() => {\n    const baseDays = [\n      { day: 'Sen', baseAi: 65, baseManual: 30 },\n      { day: 'Sel', baseAi: 78, baseManual: 35 },\n      { day: 'Rab', baseAi: 82, baseManual: 28 },\n      { day: 'Kam', baseAi: 90, baseManual: 42 },\n      { day: 'Jum', baseAi: 74, baseManual: 38 },\n      { day: 'Sab', baseAi: 55, baseManual: 20 },\n      { day: 'Min', baseAi: 88, baseManual: 32 },\n    ];\n    const liveAiBoost = conversations.reduce(\n      (sum, c) => sum + c.messages.filter((m) => m.sender === 'AI').length,\n      0\n    );\n    const liveManualBoost = conversations.reduce(\n      (sum, c) => sum + c.messages.filter((m) => m.sender === 'AGENT').length,\n      0\n    );\n\n    return baseDays.map((d, idx) => {\n      const aiVal = Math.min(100, d.baseAi + (idx === 6 ? liveAiBoost : 0));\n      const manualVal = Math.min(100, d.baseManual + (idx === 6 ? liveManualBoost : 0));\n      return { day: d.day, ai: aiVal, manual: manualVal };\n    });\n  }, [conversations]);\n\n  const getStatusBadge = (status: ConnectionStatus) => {\n    if (status === 'Connected') {\n      return (\n        \u003cspan className=\"inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200\">\n          \u003cspan className=\"w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse\" />\n          Connected\n        \u003c/span>\n      );\n    }\n    if (status === 'Connecting') {\n      return (\n        \u003cspan className=\"inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200\">\n          Connecting\n        \u003c/span>\n      );\n    }\n    return (\n      \u003cspan className=\"inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200\">\n        Disconnected\n      \u003c/span>\n    );\n  };\n\n  return (\n    \u003cdiv className=\"space-y-6\">\n      {/* Global Search Instant Results Banner */}\n      {q && (\n        \u003cdiv className=\"bg-white rounded-xl border border-emerald-200 p-4 shadow-sm space-y-3\">\n          \u003cdiv className=\"flex items-center justify-between\">\n            \u003cdiv className=\"flex items-center gap-2 text-xs font-bold text-slate-900\">\n              \u003cSearch className=\"w-4 h-4 text-emerald-600\" />\n              Hasil Pencarian Global untuk &ldquo;{globalSearch}&rdquo;\n            \u003c/div>\n            \u003cspan className=\"text-[11px] text-slate-400\">\n              {filteredAccounts.length} akun • {filteredConvsForSearch.length} chat • {filteredTicketsForSearch.length} tiket\n            \u003c/span>\n          \u003c/div>\n          \u003cdiv className=\"grid grid-cols-1 md:grid-cols-2 gap-3 text-xs\">\n            \u003cdiv>\n              \u003cdiv className=\"font-semibold text-slate-500 mb-1\">Percakapan Cocok ({filteredConvsForSearch.length})\u003c/div>\n              {filteredConvsForSearch.length === 0 ? (\n                \u003cdiv className=\"text-slate-400 italic\">Tidak ada percakapan cocok.\u003c/div>\n              ) : (\n                \u003cdiv className=\"space-y-1\">\n                  {filteredConvsForSearch.map((c) => (\n                    \u003cbutton\n                      key={c.id}\n                      onClick={() => {\n                        onSelectInboxAccount(c.accountId);\n                        onNavigate('inbox');\n                      }}\n                      className=\"w-full text-left px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-emerald-50 flex justify-between\"\n                    >\n                      \u003cspan className=\"font-semibold text-slate-800\">{c.customerName}\u003c/span>\n                      \u003cspan className=\"text-emerald-600 font-semibold\">Buka Inbox →\u003c/span>\n                    \u003c/button>\n                  ))}\n                \u003c/div>\n              )}\n            \u003c/div>\n            \u003cdiv>\n              \u003cdiv className=\"font-semibold text-slate-500 mb-1\">Tiket Cocok ({filteredTicketsForSearch.length})\u003c/div>\n              {filteredTicketsForSearch.length === 0 ? (\n                \u003cdiv className=\"text-slate-400 italic\">Tidak ada tiket cocok.\u003c/div>\n              ) : (\n                \u003cdiv className=\"space-y-1\">\n                  {filteredTicketsForSearch.map((t) => (\n                    \u003cbutton\n                      key={t.id}\n                      onClick={() => onNavigate('tickets')}\n                      className=\"w-full text-left px-3 py-1.5 rounded-lg bg-slate-50 hover:bg-blue-50 flex justify-between\"\n                    >\n                      \u003cspan className=\"font-semibold text-blue-700\">\n                        {t.id} — {t.title}\n                      \u003c/span>\n                      \u003cspan className=\"text-slate-500\">{t.status}\u003c/span>\n                    \u003c/button>\n                  ))}\n                \u003c/div>\n              )}\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      )}\n\n      {/* Top Title & Period Filter */}\n      \u003cdiv className=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n        \u003cdiv>\n          \u003ch1 className=\"text-xl font-bold text-slate-900\">Dashboard Overview\u003c/h1>\n          \u003cp className=\"text-xs text-slate-500\">\n            Statistik dinamis ({PERIOD_MULTIPLIER[statsPeriod].label}) untuk 4 akun WhatsApp, AI Assistant terisolasi, dan tiket.\n          \u003c/p>\n        \u003c/div>\n        \u003cdiv className=\"inline-flex bg-white border border-slate-200 rounded-lg p-1 text-xs\">\n          {(['HARI', 'MINGGU', 'BULAN', 'CUSTOM'] as const).map((p) => (\n            \u003cbutton\n              key={p}\n              onClick={() => onChangePeriod(p)}\n              className={`px-3 py-1 rounded-md font-medium transition ${\n                statsPeriod === p ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'\n              }`}\n            >\n              {p === 'HARI'\n                ? 'Hari Ini'\n                : p === 'MINGGU'\n                ? 'Minggu Ini'\n                : p === 'BULAN'\n                ? 'Bulan Ini'\n                : 'Rentang Tanggal'}\n            \u003c/button>\n          ))}\n        \u003c/div>\n      \u003c/div>\n\n      {/* 4 WHATSAPP ACCOUNTS OVERVIEW CARDS */}\n      \u003cdiv>\n        \u003cdiv className=\"flex items-center justify-between mb-3\">\n          \u003ch2 className=\"text-sm font-bold text-slate-800\">Status 4 Akun WhatsApp Terpusat\u003c/h2>\n          \u003cbutton\n            onClick={() => onNavigate('wa-accounts')}\n            className=\"text-xs font-semibold text-emerald-600 hover:underline flex items-center gap-1\"\n          >\n            Kelola Semua Akun \u003cChevronRight className=\"w-3.5 h-3.5\" />\n          \u003c/button>\n        \u003c/div>\n        \u003cdiv className=\"grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4\">\n          {filteredAccounts.map((acc) => {\n            const mult = PERIOD_MULTIPLIER[statsPeriod].factor;\n            return (\n              \u003cdiv\n                key={acc.id}\n                className=\"bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:border-emerald-300 transition flex flex-col justify-between\"\n              >\n                \u003cdiv>\n                  \u003cdiv className=\"flex items-start justify-between gap-2\">\n                    \u003cdiv className=\"flex items-center gap-2.5\">\n                      \u003cdiv className=\"w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center justify-center font-bold text-xs\">\n                        {acc.avatar}\n                      \u003c/div>\n                      \u003cdiv>\n                        \u003cdiv className=\"text-xs font-bold text-slate-900 line-clamp-1\">{acc.name}\u003c/div>\n                        \u003cdiv className=\"text-[11px] text-slate-500\">{acc.phone}\u003c/div>\n                      \u003c/div>\n                    \u003c/div>\n                  \u003c/div>\n\n                  \u003cdiv className=\"mt-3 flex items-center justify-between\">\n                    {getStatusBadge(acc.status)}\n                    \u003cspan\n                      className={`px-2 py-0.5 rounded text-[10px] font-bold ${\n                        acc.defaultMode === 'AI'\n                          ? 'bg-blue-50 text-blue-700 border border-blue-200'\n                          : 'bg-slate-100 text-slate-700 border border-slate-200'\n                      }`}\n                    >\n                      {acc.defaultMode} MODE\n                    \u003c/span>\n                  \u003c/div>\n\n                  \u003cdiv className=\"mt-3 pt-3 border-t border-slate-100 grid grid-cols-2 gap-2 text-center\">\n                    \u003cdiv className=\"bg-slate-50 rounded-lg p-1.5\">\n                      \u003cdiv className=\"text-[10px] text-slate-400\">Pesan Masuk\u003c/div>\n                      \u003cdiv className=\"text-sm font-bold text-slate-800\">\n                        {Math.round(acc.incomingToday * mult).toLocaleString('id-ID')}\n                      \u003c/div>\n                    \u003c/div>\n                    \u003cdiv className=\"bg-slate-50 rounded-lg p-1.5\">\n                      \u003cdiv className=\"text-[10px] text-slate-400\">Pesan Keluar\u003c/div>\n                      \u003cdiv className=\"text-sm font-bold text-slate-800\">\n                        {Math.round(acc.outgoingToday * mult).toLocaleString('id-ID')}\n
